<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>Slidy-AI-Redesign</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet"/>
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">

    <link rel="stylesheet" href="./assets/css/style.css"/>



    <meta name="robots" content="noindex, nofollow">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-body G-align-center">
                <div class="header-tools G-align-center">
                    <a href="index.html" class="header-logo G-flex">
                        <img
                                loading="eager"
                                src="assets/images/logo.svg"
                                data-light="assets/images/logo.svg"
                                data-dark="assets/images/logo-dark.svg"
                                alt="Slidy"
                                fetchpriority="high"
                                width="96"
                                height="29"
                                style="width: auto; height: auto"
                        />
                    </a>

                </div>

                <div class="header-actions G-align-center">
                    <div class="language-select-wrapper header-select-wrapper">
                        <div class="language-select-header G-align-center">
                            <div class="l-select-flag G-flex">
                                <img
                                        loading="lazy"
                                        src="assets/images/flag1.svg"
                                        alt=""
                                        width="28"
                                        height="20"
                                />
                            </div>
                            <p>Русский</p>
                            <i class="icon icon-arrow-down"></i>
                        </div>
                    </div>

                    <a href="#" class="btn-login">
                        <span class="desktop-block">Вход</span>
                    </a>
                    <a href="#" class="btn-register">
                        <span class="desktop-block">Попробовать <span>бесплатно</span></span>
                        <i class="icon icon-arrow mobile-block"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>
    <section class="error-page">
            <div class="container">
                <div class="section-titles fade-bottom G-column-center show">
                    <div class="section-tag G-align-center">
                        <i class="icon icon-star"></i>
                        <span>Упс! Что‑то пошло не так..</span>
                    </div>
                    <h2 class="section-big-title">
                        <span class="error-page-title">
                            Страница
                        </span>
                        <span class="text-blue"> не найдена</span>
                        <img loading="lazy"
                             src="assets/images/error-points-light.png"
                             data-light="assets/images/error-points-light.png"
                             data-dark="assets/images/error-points.png"
                             alt="" width="80" height="40">
                    </h2>
                    <p class="section-sub-title">
                        Похоже, вы перешли по ссылке, которая <strong>больше не работает.</strong> Или такой <strong>страницы никогда не существовало.</strong>
                    </p>

                    <button class="btn-black trust-btn G-align-center">
                        <i class="icon icon-stars"></i>
                        <span>Вернуться на главную</span>
                    </button>
                </div>
            </div>

            <div class="error-page-fon">
                <img loading="lazy"
                     src="assets/images/error-bg-light.webp"
                     data-light="assets/images/error-bg-light.webp"
                     data-dark="assets/images/error-bg.webp"
                     alt=""
                     class="img-desktop"
                />
                <img loading="lazy"
                     src="assets/images/error-bg-mob-light.webp"
                     data-light="assets/images/error-bg-mob-light.webp"
                     data-dark="assets/images/error-bg-mob.webp"
                     alt=""
                     class="img-mobile"
                />
            </div>

        </section>





<script defer src="https://cdn.jsdelivr.net/npm/macy@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.event.move/1.3.6/jquery.event.move.min.js" defer></script>
<script defer src="assets/js/swiper.js"></script>
<script defer src="assets/js/catalog.js"></script>
<script defer src="assets/js/index.js"></script>




</body>
</html>
